name: NLP.js - Phase 2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nlp-phase2.mjs'
      - 'data/validation-40.json'
      - '.github/workflows/nlp-phase2.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les versions fixees
        run: npm install --no-audit --no-fund
      - name: Comparer quatre configurations NLP.js
        run: node scripts/nlp-phase2.mjs
      - name: Exporter toutes les predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-nlp-phase2
          path: results/nlp-phase2.*
          if-no-files-found: warn
